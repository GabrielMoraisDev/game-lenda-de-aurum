<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<title>A Lenda de Aurum</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0b12'/><path d='M7 2h2v8H7z' fill='%23dfe6f2'/><path d='M5 10h6v2H5z' fill='%23ffd34d'/></svg>">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="256" height="208"></canvas>
    <div id="loading">carregando...</div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button class="k up" data-act="up"></button>
      <button class="k left" data-act="left"></button>
      <button class="k right" data-act="right"></button>
      <button class="k down" data-act="down"></button>
    </div>
    <div class="acts">
      <button class="b giro" data-act="spin">C</button>
      <button class="b ouro" data-act="gold">V</button>
      <button class="b esp" data-act="special">X</button>
      <button class="b fire" data-act="fire">F</button>
      <button class="b roll" data-act="roll">ROL</button>
      <button class="b atk" data-act="attack">A</button>
      <button class="b st" data-act="start">≡</button>
    </div>
  </div>

  <script src="src/core.js"></script>
  <script src="src/net.js"></script>
  <script src="src/art.js"></script>
  <script src="src/world.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/mundos.js"></script>
  <script src="src/chefes.js"></script>
  <script src="src/batalha.js"></script>
  <script src="src/historia.js"></script>
  <script src="src/game.js"></script>
  <script>AURUM.boot();</script>
</body>
</html>
